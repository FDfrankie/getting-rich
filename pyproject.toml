[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-quant"
version = "1.0.0"
description = "Antigravity Quant: Automated Crypto and Taiwan Stock Quant Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "ccxt>=4.0.0",
    "lightgbm>=4.0.0",
    "torch>=2.0.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "apscheduler>=3.10.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "yfinance>=0.2.30",
    "beautifulsoup4>=4.12.0",
    "gymnasium>=0.29.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0"
]

[tool.setuptools.packages.find]
include = ["crypto_trading*", "taiwan_stock*", "us_stock*", "worldquant_brain*", "data_persistence*", "web_ui*", "model_governance*", "notifications*", "observability*", "portfolio*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E741", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "quant_envs", "temp", ".antigravity-stage0", ".post_v5_backups", ".patch_backups", ".venv", "dist"]
