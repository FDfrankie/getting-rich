services:
  - type: web
    name: getting-rich
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8999
      - key: HOST
        value: 0.0.0.0
      - key: PAPER_TRADING
        value: "True"
      - key: DEFAULT_SETTLEMENT_CURRENCY
        value: "USDC"
      - key: RENDER_LIGHTWEIGHT_INFERENCE
        value: "True"
      - key: BRAIN_SIMULATION_ENABLED
        value: "true"
      - key: BRAIN_AUTO_SUBMIT_ENABLED
        value: "true"
      - key: BRAIN_QUEUE_WORKERS
        value: "2"
      - key: BRAIN_MAX_DAILY_SUBMISSIONS
        value: "2"
      - key: BRAIN_DAILY_FLUSH_HOUR
        value: "22"
      - key: BRAIN_EMAIL
        sync: false
      - key: BRAIN_PASSWORD
        sync: false
