services:
  - type: web
    name: antigravity-quant-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python web_ui/app.py
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: PAPER_TRADING
        value: "True"
