services:
  - type: web
    name: antigravity-quant-web
    runtime: docker
    plan: starter
    region: singapore
    envVars:
      - key: TRADING_MODE
        value: LOCAL_PAPER
      - key: ENABLE_LIVE_TRADING
        value: ""
      - key: BRAIN_AUTO_SUBMIT_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: antigravity-db
          property: connectionString
  - type: worker
    name: antigravity-brain-worker
    runtime: docker
    plan: starter
    region: singapore
    startCommand: python -m worldquant_brain.worker_main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: antigravity-db
          property: connectionString
      - key: BRAIN_AUTO_SUBMIT_ENABLED
        value: "false"
  - type: cron
    name: antigravity-taiwan-universe
    runtime: docker
    schedule: "20 7 * * 1-5"
    startCommand: python scripts/sync_taiwan_universe.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: antigravity-db
          property: connectionString
databases:
  - name: antigravity-db
    plan: basic-256mb
    region: singapore
