version: '3.8'

services:
  quant_app:
    build: .
    container_name: antigravity_quant_dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PAPER_TRADING=True
      - INITIAL_BALANCE_USDT=10000
    volumes:
      - ./data:/app/data
      - ./worldquant_brain:/app/worldquant_brain
      - ./taiwan_stock/reports:/app/taiwan_stock/reports
